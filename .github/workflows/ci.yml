name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint
        run: npm run lint
      
      - name: Backend Tests
        run: npm run test --workspace=api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/directorbyte_test
          JWT_SECRET: "test-jwt-secret-very-long-and-secure-123"
          ENCRYPTION_KEY: "12345678901234567890123456789012"
          ADMIN_PASSWORD_HASH: "test-hash-here"
          ADMIN_SESSION_SECRET: "12345678901234567890123456789012"
          SMTP_HOST: "smtp.example.com"
          SMTP_USER: "test"
          SMTP_PASS: "test"
          EMAIL_FROM: "test@example.com"
      
      - name: Frontend Tests
        run: npm run test --workspace=web
